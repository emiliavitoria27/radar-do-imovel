[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'sem etapa de build'"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ler-imovel"
  to = "/.netlify/functions/ler-imovel"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
